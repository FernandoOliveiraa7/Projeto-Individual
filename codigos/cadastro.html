
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro | Nasci Corinthiano</title>
    <link rel="stylesheet" href="cadastro.css">
</head>
<body class="pagina-cadastro">

    <!-- CABEÇALHO -->
    <header class="cabecalho">
        <div class="logo">
            <img src="img/corinthians.png" alt="Escudo do Corinthians" class="escudo">
            <span>Nasci Corinthiano</span>
        </div>
        <nav class="menu">
            <a href="index.html">Voltar para a Home</a>
        </nav>
    </header>

    <main class="container-cadastro">
        <div class="caixa-cadastro">

            <!-- Lado esquerdo: painel preto -->
            <section class="lado-painel">
                <h2>Já é da Fiel?</h2>
                <p>Entre com o seu e-mail e a sua senha para agendar o seu tour.</p>
                <a href="login.html" class="botao-contorno">ENTRAR</a>
            </section>

            <!-- Lado direito: formulário -->
            <section class="lado-formulario">
                <div class="conteudo-formulario">
                    <h1>Crie sua conta</h1>
                    <p class="subtitulo-form">Preencha os dados para entrar para a Fiel.</p>

                    <label for="input_nome">Nome</label>
                    <input type="text" id="input_nome" class="campo" placeholder="Seu nome">

                    <label for="input_email">E-mail</label>
                    <input type="text" id="input_email" class="campo" placeholder="voce@email.com">

                    <label for="input_senha">Senha</label>
                    <input type="password" id="input_senha" class="campo" placeholder="Mínimo de 6 caracteres">

                    <label for="input_confirmacao">Confirme a senha</label>
                    <input type="password" id="input_confirmacao" class="campo" placeholder="Repita a senha">

                    <label for="select_heranca">Quem te fez corinthiano?</label>
                    <select id="select_heranca" class="campo">
                        <option value="">Escolha uma opção</option>
                        <option value="Pai">Pai</option>
                        <option value="Mãe">Mãe</option>
                        <option value="Avô/Avó">Avô/Avó</option>
                        <option value="Tio/Tia">Tio/Tia</option>
                        <option value="Outro familiar">Outro familiar</option>
                        <option value="Amigo">Amigo</option>
                        <option value="Nasci assim">Nasci assim</option>
                    </select>

                    <div class="area-botao">
                        <button class="botao-preto" onclick="cadastrar()">CADASTRAR</button>
                    </div>

                    <p id="mensagem_cadastro" class="mensagem"></p>
                </div>
            </section>

        </div>
    </main>

    <!-- RODAPÉ -->
    <footer class="rodape">
        Projeto acadêmico. Feito por um corinthiano de nascença.
    </footer>

</body>

<script>
    function cadastrar() {
        var nome = input_nome.value;
        var email = input_email.value;
        var senha = input_senha.value;
        var confirmacao = input_confirmacao.value;
        var heranca = select_heranca.value;

        if (nome == "" || email == "" || senha == "" || confirmacao == "" || heranca == "") {
            mensagem_cadastro.innerHTML = "Preencha todos os campos.";
        } else if (nome.length < 3) {
            mensagem_cadastro.innerHTML = "O nome precisa ter pelo menos 3 letras.";
        } else if (email.indexOf("@") == -1) {
            mensagem_cadastro.innerHTML = "Digite um e-mail válido.";
        } else if (senha.length < 6) {
            mensagem_cadastro.innerHTML = "A senha precisa ter pelo menos 6 caracteres.";
        } else if (senha != confirmacao) {
            mensagem_cadastro.innerHTML = "As senhas não são iguais.";
        } else {
            mensagem_cadastro.innerHTML = "Cadastro realizado! Agora é só fazer o login.";
            // AQUI entra o cadastro na API, quando a gente ligar o banco
        }
    }
</script>

</html>
